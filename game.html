<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>対局中 - しおや麻雀</title>
    <style>
        @font-face { font-family: 'SetoFont'; src: url('font/setofont.ttf') format('truetype'); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { font-family: 'SetoFont', "Hiragino Kaku Gothic ProN", sans-serif; background-color: #1e5631; color: #ECDBBF; width: 100vw; height: 100vh; overflow: hidden; display: flex; flex-direction: column; user-select: none; }
        .info-bar { background: rgba(67, 37, 23, 0.9); padding: 10px 20px; display: flex; justify-content: space-between; border-bottom: 3px solid #ECDBBF; z-index: 10; }
        .table-area { flex: 1; position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .character-stand { position: absolute; bottom: 120px; left: 10px; height: 40vh; filter: drop-shadow(0 0 10px rgba(0,0,0,0.5)); z-index: 1; pointer-events: none; }
        .score-panel { position: absolute; background: rgba(0,0,0,0.6); border: 2px solid #ECDBBF; padding: 5px 10px; border-radius: 5px; font-weight: bold; text-align: center; z-index: 6; font-size: 1.1rem; }
        .score-panel.oya { border-color: #ff9800; color: #ff9800; } 
        
        .rivers-container { position: relative; width: 550px; height: 550px; display: grid; grid-template-columns: 170px 210px 170px; grid-template-rows: 170px 210px 170px; justify-items: center; align-items: center; z-index: 5; }
        .river-box { background: rgba(0,0,0,0.3); border: 2px dashed rgba(236, 219, 191, 0.3); border-radius: 8px; padding: 4px; display: flex; align-content: flex-start; position: relative; }
        .river-top { grid-column: 2; grid-row: 1; width: 210px; height: 150px; flex-direction: row-reverse; flex-wrap: wrap-reverse; }
        .river-bottom { grid-column: 2; grid-row: 3; width: 210px; height: 150px; flex-direction: row; flex-wrap: wrap; }
        .river-left { grid-column: 1; grid-row: 2; width: 150px; height: 210px; flex-direction: column; flex-wrap: wrap-reverse; }
        .river-right { grid-column: 3; grid-row: 2; width: 150px; height: 210px; flex-direction: column-reverse; flex-wrap: wrap; }
        .river-pai-v { width: 30px; height: 42px; margin: 1px; border-radius: 2px; box-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
        .river-pai-h { width: 42px; height: 30px; margin: 1px; border-radius: 2px; box-shadow: 1px 1px 3px rgba(0,0,0,0.8); }

        .hand-area { height: 110px; background: #432517; border-top: 4px solid #ECDBBF; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 10px; z-index: 10; }
        .pai-img { height: 70px; width: auto; border-radius: 4px; box-shadow: 2px 2px 5px rgba(0,0,0,0.5); cursor: pointer; transition: transform 0.1s; }
        .my-turn .pai-img:hover { transform: translateY(-10px); }
        .my-turn .pai-img:active { transform: translateY(-15px); }
        .tsumo-pai { margin-left: 15px; }
        .fulou-group { display: flex; margin-left: 15px; padding-left: 15px; border-left: 2px dashed #ECDBBF; }

        #turnIndicator { position: absolute; font-size: 2rem; font-weight: bold; color: rgba(255, 255, 255, 0.3); z-index: 0; pointer-events: none; }
        #shantenIndicator { position: absolute; bottom: 230px; font-size: 1.2rem; font-weight: bold; color: #ECDBBF; background: rgba(67, 37, 23, 0.9); border: 2px solid #ff9800; padding: 5px 15px; border-radius: 20px; z-index: 10; pointer-events: none; transition: 0.3s; }
        #actionBox { position: absolute; bottom: 150px; display: none; gap: 15px; z-index: 100; }
        .btn-action { background: linear-gradient(to bottom, #ff9800, #f57c00); color: white; border: 3px solid #ECDBBF; border-radius: 10px; padding: 10px 20px; font-size: 1.5rem; font-weight: bold; cursor: pointer; font-family: 'SetoFont', sans-serif; box-shadow: 0 5px 10px rgba(0,0,0,0.5); transition: transform 0.1s; }
        .btn-action:active { transform: scale(0.9); }
        .btn-skip { background: linear-gradient(to bottom, #9e9e9e, #757575); }

        .cpu-hand-area { position: absolute; display: flex; gap: 1px; z-index: 5; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 5px; pointer-events: none; border: 1px dashed #ECDBBF; }
        .top-hand { top: 10px; left: 50%; transform: translateX(-50%); }
        .left-hand { left: 10px; top: 50%; transform: translateY(-50%); flex-direction: column; }
        .right-hand { right: 10px; top: 50%; transform: translateY(-50%); flex-direction: column; }
        .cpu-pai-debug { width: 20px; height: 28px; border-radius: 2px; }
    </style>
</head>
<body>

    <div class="info-bar">
        <div><span id="gameInfoText" style="font-weight: bold; font-size: 1.1rem;">東1局</span> <span id="honbaText">0</span>本場 供託:<span id="kyotakuText">0</span> <span id="deckCount" style="margin-left:15px; font-size: 0.9rem; opacity: 0.8;">残り山札: --</span></div>
        <button onclick="window.location.href='index.html'" style="padding: 5px 10px; font-family: 'SetoFont'; background: #432517; color: #ECDBBF; border: 1px solid #ECDBBF; border-radius: 5px; cursor: pointer;">ロビーに戻る</button>
    </div>

    <div class="table-area">
        <img id="playerStandImage" class="character-stand" src="" alt="自キャラ">
        <div id="turnIndicator">あなた の番</div>
        <div id="shantenIndicator">計算中...</div>

        <div id="cpuHand-2" class="cpu-hand-area top-hand"></div>
        <div id="cpuHand-3" class="cpu-hand-area left-hand"></div>
        <div id="cpuHand-1" class="cpu-hand-area right-hand"></div>

        <div id="actionBox">
            <button id="btn-tsumo" class="btn-action" style="background: linear-gradient(to bottom, #e91e63, #c2185b); display: none;" onclick="executeAgari('tsumo')">ツモ</button>
            <button id="btn-ron" class="btn-action" style="background: linear-gradient(to bottom, #e91e63, #c2185b); display: none;" onclick="executeAgari('ron')">ロン</button>
            <button id="btn-riichi" class="btn-action" style="background: linear-gradient(to bottom, #03a9f4, #0288d1); display: none;" onclick="declareRiichi()">リーチ</button>
            <button id="btn-pon" class="btn-action" onclick="executeNaki('pon')">ポン</button>
            <button id="btn-chii" class="btn-action" onclick="executeNaki('chii')">チー</button>
            <button id="btn-kan" class="btn-action" onclick="executeNaki('kan')">カン</button>
            <button id="btn-skip" class="btn-action btn-skip" onclick="executeNaki('skip')">スルー</button>
        </div>

        <div id="resultModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center; flex-direction: column; text-align: center;">
            <div style="background: #ECDBBF; padding: 40px; border-radius: 20px; border: 6px solid #432517; max-width: 500px; width: 90%; box-shadow: 0 10px 30px rgba(0,0,0,0.8);">
                <h2 id="resultTitle" style="color: #e91e63; font-size: 3rem; margin-bottom: 20px;">アガリ！</h2>
                <div id="resultYaku" style="font-size: 1.5rem; color: #432517; margin-bottom: 20px; font-weight: bold; line-height: 1.8;"></div>
                <div id="resultScore" style="font-size: 2.5rem; color: #ff9800; font-weight: bold; margin-bottom: 30px;"></div>
                <button id="btn-next-kyoku" class="btn-action" onclick="prepareNextKyoku()" style="font-size: 1.2rem; padding: 15px 30px;">次へ</button>
            </div>
        </div>

        <div class="rivers-container">
            <div id="score-2" class="score-panel" style="grid-column: 2; grid-row: 1; transform: translateY(-70px);">CPU(前)<br>25000</div>
            <div id="score-3" class="score-panel" style="grid-column: 1; grid-row: 2; transform: translateX(-50px);">CPU(左)<br>25000</div>
            <div id="score-1" class="score-panel" style="grid-column: 3; grid-row: 2; transform: translateX(50px);">CPU(右)<br>25000</div>
            <div id="score-0" class="score-panel" style="grid-column: 2; grid-row: 3; transform: translateY(70px);">あなた<br>25000</div>

            <div class="river-box river-top" id="river-2"></div> 
            <div class="river-box river-left" id="river-3"></div> 
            <div class="river-box river-right" id="river-1"></div> 
            <div class="river-box river-bottom" id="river-0"></div> 
        </div>
    </div>

    <div class="hand-area my-turn" id="myHandArea"></div>

    <script type="module">
        import Majiang from '@kobalab/majiang-core';

        const characterMaster = {
            "komiya": { name: "こみや", img: "image/character/komiya_touka.png", aiType: "menzen" },
            "char_a": { name: "キャラA", img: "image/character/a_touka.png", aiType: "menzen" },
            "char_b": { name: "キャラB", img: "image/character/b_touka.png", aiType: "naki_safe" },
            "char_c": { name: "キャラC", img: "image/character/c_touka.png", aiType: "damaten" },
            "char_d": { name: "キャラD", img: "image/character/d_touka.png", aiType: "menzen" }
        };

        let gameState = { kyoku: 1, honba: 0, kyotaku: 0, currentOya: 0, startingOya: 0 };
        let mountain = []; let currentTurn = 0; 
        
        let players = [
            { id: 0, name: "あなた", score: 25000, hand: [], river: [], tsumo: null, fulou: [], isRiichi: false, aiType: "human" },
            { id: 1, name: "CPU(右)", score: 25000, hand: [], river: [], tsumo: null, fulou: [], isRiichi: false, aiType: "menzen" },
            { id: 2, name: "CPU(前)", score: 25000, hand: [], river: [], tsumo: null, fulou: [], isRiichi: false, aiType: "menzen" },
            { id: 3, name: "CPU(左)", score: 25000, hand: [], river: [], tsumo: null, fulou: [], isRiichi: false, aiType: "menzen" }
        ];

        let isRiichiMode = false; let validRiichiDiscards = []; let pendingNaki = null;
        let nextKyokuState = { oyaRenchan: false };

        function getPaiImagePath(suit, num, playerIndex) {
            const dirMap = [1, 3, 2, 4]; const direction = dirMap[playerIndex]; 
            if (suit === 'm') return `image/pai/manzu_all/p_ms${num}_${direction}.gif`;
            if (suit === 'p') return `image/pai/pinzu_all/p_ps${num}_${direction}.gif`;
            if (suit === 's') return `image/pai/sozu_all/p_ss${num}_${direction}.gif`;
            if (suit === 'z') {
                const zMap = {1:'e', 2:'s', 3:'w', 4:'n', 5:'no', 6:'h', 7:'c'};
                if (num === 5) return `image/pai/tupai_all/p_no_${direction}.gif`;
                return `image/pai/tupai_all/p_ji_${zMap[num]}_${direction}.gif`;
            }
        }

        function createDeck() {
            let deck = []; let idCounter = 0;
            ['m', 'p', 's'].forEach(suit => { for (let num = 1; num <= 9; num++) { for (let i = 0; i < 4; i++) deck.push({ id: idCounter++, suit: suit, num: num }); } });
            for (let num = 1; num <= 7; num++) { for (let i = 0; i < 4; i++) deck.push({ id: idCounter++, suit: 'z', num: num }); }
            return deck;
        }

        function shuffleDeck(deck) {
            for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; } return deck;
        }

        function sortHand(hand) {
            const suitOrder = { 'm': 1, 'p': 2, 's': 3, 'z': 4 };
            return hand.sort((a, b) => { if (suitOrder[a.suit] !== suitOrder[b.suit]) return suitOrder[a.suit] - suitOrder[b.suit]; return a.num - b.num; });
        }

        function getMajiangString(hand, tsumo, fulou) {
            let suits = { m: [], p: [], s: [], z: [] };
            hand.forEach(pai => suits[pai.suit].push(pai.num)); if (tsumo) suits[tsumo.suit].push(tsumo.num);
            let str = '';
            for (let s of ['m', 'p', 's', 'z']) { if (suits[s].length > 0) { suits[s].sort((a,b) => a - b); str += s + suits[s].join(''); } }
            if (fulou && fulou.length > 0) {
                let fList = fulou.map(f => { let s = f.tiles[0].suit; let nums = f.tiles.map(t => t.num).sort().join(''); return s + nums + '-'; });
                str += ',' + fList.join(',');
            }
            return str;
        }

        function startKyoku() {
            mountain = shuffleDeck(createDeck()); isRiichiMode = false; pendingNaki = null;
            players.forEach(p => { p.hand = []; p.river = []; p.fulou = []; p.tsumo = null; p.isRiichi = false; });
            for (let i = 0; i < 4; i++) { for (let j = 0; j < 13; j++) players[i].hand.push(mountain.pop()); players[i].hand = sortHand(players[i].hand); }
            currentTurn = gameState.currentOya; players[currentTurn].tsumo = mountain.pop();
            renderAll(); updateScoresUI();
            if (currentTurn !== 0) setTimeout(() => { executeCPUTurn(currentTurn); }, 800);
        }

        window.executeAgari = function(type, winnerIndex = 0, cpuHule = null) {
            document.getElementById('actionBox').style.display = 'none'; let my = players[winnerIndex]; let hule = cpuHule; let discarderIndex = -1;
            if (!hule) {
                let handStr = getMajiangString(my.hand, type === 'tsumo' ? my.tsumo : null, my.fulou);
                let shoupai = Majiang.Shoupai.fromString(handStr); let rongpai = null;
                if (type === 'ron') { let relMap = { 1: '-', 2: '=', 3: '+' }; discarderIndex = pendingNaki.discarderIndex; let rel = (4 + discarderIndex - winnerIndex) % 4; rongpai = pendingNaki.discardedPai.suit + pendingNaki.discardedPai.num + relMap[rel]; }
                let menfeng = (winnerIndex - gameState.currentOya + 4) % 4;
                let param = { rule: Majiang.rule(), zhuangfeng: 0, menfeng: menfeng, hupai: { lizhi: my.isRiichi ? 1 : 0 }, baopai: ['m1'], fubaopai: [], jicun: { changbang: 0, lizhibang: 0 } };
                hule = Majiang.Util.hule(shoupai, rongpai, param);
            } else { if (type === 'ron') discarderIndex = pendingNaki.discarderIndex; }
            if (!hule || !hule.hupai) { alert("エラー：役がありません！"); return; }
            let honbaPoints = gameState.honba * 300; let kyotakuPoints = gameState.kyotaku * 1000; let menfeng = (winnerIndex - gameState.currentOya + 4) % 4;
            if (type === 'tsumo') {
                if (menfeng === 0) { let pay = Math.ceil((hule.defen / 3) / 100) * 100; players.forEach((p, i) => { if (i !== winnerIndex) p.score -= (pay + honbaPoints / 3); }); my.score += (pay * 3 + honbaPoints); } 
                else { let payOya = Math.ceil((hule.defen / 2) / 100) * 100; let payKo = Math.ceil((hule.defen / 4) / 100) * 100; players.forEach((p, i) => { if (i === winnerIndex) return; if (i === gameState.currentOya) p.score -= (payOya + honbaPoints / 3); else p.score -= (payKo + honbaPoints / 3); }); my.score += (payOya + payKo * 2 + honbaPoints); }
            } else { players[discarderIndex].score -= (hule.defen + honbaPoints); my.score += (hule.defen + honbaPoints); }
            my.score += kyotakuPoints; gameState.kyotaku = 0; nextKyokuState.oyaRenchan = (menfeng === 0);
            let winnerName = players[winnerIndex].name;
            let title = type === 'tsumo' ? `🎉 ${winnerName} のツモ！` : `💥 ${winnerName} のロン！`;
            let yakuText = hule.hupai.map(h => `${h.name} ${h.fanshu}翻`).join('<br>'); let scoreText = `${hule.fu}符 ${hule.fanshu}翻<br><span style="font-size:3.5rem">${hule.defen} 点</span>`;
            if (honbaPoints > 0) scoreText += `<br><span style="font-size:1.5rem">本場 +${honbaPoints}点</span>`;
            document.getElementById('resultTitle').textContent = title; document.getElementById('resultYaku').innerHTML = yakuText; document.getElementById('resultScore').innerHTML = scoreText; document.getElementById('btn-next-kyoku').textContent = "次へ"; document.getElementById('resultModal').style.display = 'flex'; updateScoresUI();
        };

        function executeRyukyoku() {
            let tenpaiPlayers = []; players.forEach((p, index) => { let handStr = getMajiangString(p.hand, p.tsumo, p.fulou); if (Majiang.Util.xiangting(Majiang.Shoupai.fromString(handStr)) === 0) tenpaiPlayers.push(index); });
            let tenpaiCount = tenpaiPlayers.length;
            if (tenpaiCount > 0 && tenpaiCount < 4) { let receive = 3000 / tenpaiCount; let pay = 3000 / (4 - tenpaiCount); players.forEach((p, i) => { if (tenpaiPlayers.includes(i)) p.score += receive; else p.score -= pay; }); }
            nextKyokuState.oyaRenchan = tenpaiPlayers.includes(gameState.currentOya);
            let statusText = tenpaiCount === 4 ? "全員テンパイ" : tenpaiCount === 0 ? "全員ノーテン" : `${tenpaiCount}人テンパイ`;
            document.getElementById('resultTitle').textContent = "流局"; document.getElementById('resultTitle').style.color = "#9e9e9e"; document.getElementById('resultYaku').innerHTML = statusText; document.getElementById('resultScore').innerHTML = ""; document.getElementById('btn-next-kyoku').textContent = "次へ"; document.getElementById('resultModal').style.display = 'flex'; updateScoresUI();
        }

        window.prepareNextKyoku = function() {
            document.getElementById('resultModal').style.display = 'none'; document.getElementById('resultTitle').style.color = "#e91e63";
            if (nextKyokuState.oyaRenchan) gameState.honba++; else { gameState.currentOya = (gameState.currentOya + 1) % 4; gameState.kyoku++; gameState.honba = 0; }
            if (gameState.kyoku > 4) showFinalRanking(); else startKyoku();
        };

        function showFinalRanking() {
            let sorted = [...players].sort((a, b) => b.score - a.score); let rankText = sorted.map((p, i) => `${i+1}位：${p.name} (${p.score}点)`).join('<br><br>');
            document.getElementById('resultTitle').textContent = "終局・最終順位"; document.getElementById('resultYaku').innerHTML = rankText; document.getElementById('resultScore').innerHTML = ""; document.getElementById('btn-next-kyoku').textContent = "ロビーに戻る"; document.getElementById('btn-next-kyoku').onclick = () => window.location.href='index.html'; document.getElementById('resultModal').style.display = 'flex';
        }

        function updateScoresUI() {
            document.getElementById('gameInfoText').textContent = `東${gameState.kyoku}局`; document.getElementById('honbaText').textContent = gameState.honba; document.getElementById('kyotakuText').textContent = gameState.kyotaku * 1000;
            players.forEach(p => { let panel = document.getElementById(`score-${p.id}`); panel.innerHTML = `${p.name}<br>${p.score}`; if (p.id === gameState.currentOya) panel.classList.add('oya'); else panel.classList.remove('oya'); });
        }

        function checkMyHand() {
            let my = players[0]; let handStr = getMajiangString(my.hand, my.tsumo, my.fulou);
            try {
                let shoupai = Majiang.Shoupai.fromString(handStr); let shanten = Majiang.Util.xiangting(shoupai); let text = ""; let indicator = document.getElementById('shantenIndicator'); let canTsumo = false;
                document.getElementById('actionBox').style.display = 'none'; document.getElementById('btn-tsumo').style.display = 'none'; document.getElementById('btn-riichi').style.display = 'none'; document.getElementById('btn-ron').style.display = 'none'; document.getElementById('btn-pon').style.display = 'none'; document.getElementById('btn-chii').style.display = 'none'; document.getElementById('btn-kan').style.display = 'none'; document.getElementById('btn-skip').style.display = 'none';
                if (shanten === -1) {
                    let menfeng = (0 - gameState.currentOya + 4) % 4; let param = { rule: Majiang.rule(), zhuangfeng: 0, menfeng: menfeng, hupai: { lizhi: my.isRiichi ? 1 : 0 }, baopai: ['m1'], fubaopai: [], jicun: { changbang: 0, lizhibang: 0 } }; let hule = Majiang.Util.hule(shoupai, null, param);
                    if (hule) { text = "🎉 ツモ！（アガリ）"; indicator.style.color = "#ffeb3b"; indicator.style.borderColor = "#ffeb3b"; canTsumo = true; if (my.tsumo) { document.getElementById('btn-tsumo').style.display = 'block'; document.getElementById('actionBox').style.display = 'flex'; } } else { text = "役なし（アガれません）"; indicator.style.color = "#9e9e9e"; indicator.style.borderColor = "#9e9e9e"; }
                } else if (shanten === 0) { text = "🔥 テンパイ！"; indicator.style.color = "#ff9800"; indicator.style.borderColor = "#ff9800"; } else { text = `${shanten} シャンテン`; indicator.style.color = "#ECDBBF"; indicator.style.borderColor = "#ECDBBF"; }
                indicator.textContent = text;
                if (my.isRiichi) { if (!canTsumo && my.tsumo) setTimeout(() => { discardPai(0, my.tsumo, true); }, 600); } else if (my.fulou.length === 0 && my.tsumo && my.score >= 1000) { validRiichiDiscards = []; let allTiles = [...my.hand, my.tsumo]; let seen = new Set(); for (let tile of allTiles) { let key = tile.suit + tile.num; if (!seen.has(key)) { seen.add(key); let simHand = allTiles.filter(t => t.id !== tile.id); if (Majiang.Util.xiangting(Majiang.Shoupai.fromString(getMajiangString(simHand, null, []))) === 0) validRiichiDiscards.push(tile); } } if (validRiichiDiscards.length > 0 && !canTsumo) { document.getElementById('btn-riichi').style.display = 'block'; document.getElementById('actionBox').style.display = 'flex'; } }
            } catch (e) { console.error(e); }
        }

        window.declareRiichi = function() { isRiichiMode = true; document.getElementById('actionBox').style.display = 'none'; document.getElementById('shantenIndicator').textContent = "捨てる牌を選んでください"; document.getElementById('shantenIndicator').style.borderColor = "#03a9f4"; };

        function checkNakiAvailable(discarderIndex, discardedPai) {
            let my = players[0]; let handStr = getMajiangString(my.hand, null, my.fulou); let shoupai = Majiang.Shoupai.fromString(handStr); let relMap = { 1: '-', 2: '=', 3: '+' }; let pStr = discardedPai.suit + discardedPai.num + relMap[discarderIndex]; let canRon = false; let tingpai = Majiang.Util.tingpai(shoupai) || [];
            if (tingpai.includes(discardedPai.suit + discardedPai.num.toString())) { let menfeng = (0 - gameState.currentOya + 4) % 4; let param = { rule: Majiang.rule(), zhuangfeng: 0, menfeng: menfeng, hupai: { lizhi: my.isRiichi ? 1 : 0 }, baopai: ['m1'], fubaopai: [], jicun: { changbang: 0, lizhibang: 0 } }; if (Majiang.Util.hule(shoupai, pStr, param)) canRon = true; }
            let chiList = my.isRiichi ? [] : (shoupai.get_chi_mianzi(pStr) || []); let ponList = my.isRiichi ? [] : (shoupai.get_peng_mianzi(pStr) || []); let kanList = my.isRiichi ? [] : (shoupai.get_gang_mianzi(pStr) || []); if (discarderIndex !== 3) chiList = [];
            if (canRon || chiList.length > 0 || ponList.length > 0 || kanList.length > 0) { pendingNaki = { discarderIndex, discardedPai, chiList, ponList, kanList, canRon }; document.getElementById('btn-tsumo').style.display = 'none'; document.getElementById('btn-riichi').style.display = 'none'; document.getElementById('btn-ron').style.display = canRon ? 'block' : 'none'; document.getElementById('btn-pon').style.display = ponList.length > 0 ? 'block' : 'none'; document.getElementById('btn-chii').style.display = chiList.length > 0 ? 'block' : 'none'; document.getElementById('btn-kan').style.display = kanList.length > 0 ? 'block' : 'none'; document.getElementById('btn-skip').style.display = 'block'; document.getElementById('actionBox').style.display = 'flex'; return true; }
            return false; 
        }

        function isTanyao(hand, tsumo, fulou, discardedPai) { let allTiles = [...hand]; if (tsumo) allTiles.push(tsumo); if (discardedPai) allTiles.push(discardedPai); if (fulou) fulou.forEach(f => allTiles = allTiles.concat(f.tiles)); for (let t of allTiles) { if (t.suit === 'z' || t.num === 1 || t.num === 9) return false; } return true; }
        function isYakuhai(tile, cpuIndex) { if (tile.suit !== 'z') return false; if (tile.num >= 5 && tile.num <= 7) return true; let menfeng = (cpuIndex - gameState.currentOya + 4) % 4; let zhuangfeng = 0; if (tile.num === zhuangfeng + 1) return true; if (tile.num === menfeng + 1) return true; return false; }

        function checkCPUActions(discarderIndex, discardedPai) {
            for (let i = 1; i < 4; i++) {
                if (i === discarderIndex) continue; let cp = players[i]; let shoupai = Majiang.Shoupai.fromString(getMajiangString(cp.hand, null, cp.fulou)); let tingpai = Majiang.Util.tingpai(shoupai) || [];
                if (tingpai.includes(discardedPai.suit + discardedPai.num.toString())) { let relMap = { 1: '-', 2: '=', 3: '+' }; let pStr = discardedPai.suit + discardedPai.num + relMap[(4 + discarderIndex - i) % 4]; let param = { rule: Majiang.rule(), zhuangfeng: 0, menfeng: (i - gameState.currentOya + 4)%4, hupai: { lizhi: cp.isRiichi ? 1 : 0 }, baopai: ['m1'], fubaopai: [], jicun: { changbang: 0, lizhibang: 0 } }; let hule = Majiang.Util.hule(shoupai, pStr, param); if (hule) { pendingNaki = { discarderIndex: discarderIndex, discardedPai: discardedPai }; setTimeout(() => executeAgari('ron', i, hule), 400); return true; } }
            }
            for (let i = 1; i < 4; i++) {
                if (i === discarderIndex) continue; let cp = players[i]; if (cp.isRiichi) continue; if (cp.aiType === "menzen" || cp.aiType === "damaten") continue;
                let handStr = getMajiangString(cp.hand, null, cp.fulou); let shoupai = Majiang.Shoupai.fromString(handStr); let currentShanten = Majiang.Util.xiangting(shoupai); let relMap = { 1: '-', 2: '=', 3: '+' }; let rel = (4 + discarderIndex - i) % 4; let pStr = discardedPai.suit + discardedPai.num + relMap[rel]; let ponList = shoupai.get_peng_mianzi(pStr) || []; let chiList = rel === 3 ? (shoupai.get_chi_mianzi(pStr) || []) : []; let bestNaki = null; let bestNakiType = '';
                if (ponList.length > 0) { let testShoupai = Majiang.Shoupai.fromString(handStr); testShoupai.fulou(ponList[0]); if (Majiang.Util.xiangting(testShoupai) < currentShanten) { bestNaki = ponList[0]; bestNakiType = 'pon'; } }
                if (!bestNaki && chiList.length > 0) { let testShoupai = Majiang.Shoupai.fromString(handStr); testShoupai.fulou(chiList[0]); if (Majiang.Util.xiangting(testShoupai) < currentShanten) { bestNaki = chiList[0]; bestNakiType = 'chii'; } }
                if (bestNaki && cp.aiType === "naki_safe") { let isSafe = false; if (bestNakiType === 'pon' && isYakuhai(discardedPai, i)) isSafe = true; else if (isTanyao(cp.hand, null, cp.fulou, discardedPai)) isSafe = true; if (isSafe) { setTimeout(() => executeCPUNaki(i, discarderIndex, discardedPai, bestNakiType, bestNaki), 400); return true; } }
            }
            return false;
        }

        window.executeNaki = function(type) { document.getElementById('actionBox').style.display = 'none'; if (type === 'skip') { let pNaki = pendingNaki; pendingNaki = null; if (checkCPUActions(pNaki.discarderIndex, pNaki.discardedPai)) return; nextTurn(); return; } let { discarderIndex, discardedPai, chiList, ponList, kanList } = pendingNaki; let my = players[0]; players[discarderIndex].river.pop(); let removedTiles = []; if (type === 'pon') { for(let i=0; i<2; i++) { let idx = my.hand.findIndex(p => p.suit === discardedPai.suit && p.num === discardedPai.num); removedTiles.push(my.hand.splice(idx, 1)[0]); } } else if (type === 'chii') { let nums = chiList[0].match(/\d/g).map(Number); let neededNums = nums.filter(n => n !== discardedPai.num); for(let n of neededNums) { let idx = my.hand.findIndex(p => p.suit === discardedPai.suit && p.num === n); removedTiles.push(my.hand.splice(idx, 1)[0]); } } else if (type === 'kan') { for(let i=0; i<3; i++) { let idx = my.hand.findIndex(p => p.suit === discardedPai.suit && p.num === discardedPai.num); removedTiles.push(my.hand.splice(idx, 1)[0]); } } my.fulou.push({ type: type, tiles: [...removedTiles, discardedPai] }); currentTurn = 0; my.tsumo = null; pendingNaki = null; renderAll(); };
        function executeCPUNaki(cpuIndex, discarderIndex, discardedPai, type, mStr) { let cp = players[cpuIndex]; players[discarderIndex].river.pop(); let removedTiles = []; if (type === 'pon') { for(let i=0; i<2; i++) { let idx = cp.hand.findIndex(p => p.suit === discardedPai.suit && p.num === discardedPai.num); removedTiles.push(cp.hand.splice(idx, 1)[0]); } } else if (type === 'chii') { let nums = mStr.match(/\d/g).map(Number); let neededNums = nums.filter(n => n !== discardedPai.num); for(let n of neededNums) { let idx = cp.hand.findIndex(p => p.suit === discardedPai.suit && p.num === n); removedTiles.push(cp.hand.splice(idx, 1)[0]); } } cp.fulou.push({ type: type, tiles: [...removedTiles, discardedPai] }); currentTurn = cpuIndex; cp.tsumo = null; renderAll(); setTimeout(() => { let allTiles = [...cp.hand]; let minShanten = 99; let bestTiles = []; for (let tile of allTiles) { let simHand = allTiles.filter(t => t.id !== tile.id); let s = Majiang.Util.xiangting(Majiang.Shoupai.fromString(getMajiangString(simHand, null, cp.fulou))); if (s < minShanten) { minShanten = s; bestTiles = [tile]; } else if (s === minShanten) { bestTiles.push(tile); } } discardPai(cpuIndex, bestTiles[Math.floor(Math.random() * bestTiles.length)], false); }, 600); }
        function discardPai(playerIndex, discardedPai, isTsumo) { let p = players[playerIndex]; if (playerIndex === 0 && isRiichiMode) { let isValid = validRiichiDiscards.some(t => t.suit === discardedPai.suit && t.num === discardedPai.num); if (!isValid) { alert("その牌を切ってリーチはできません"); return; } p.isRiichi = true; p.score -= 1000; gameState.kyotaku++; isRiichiMode = false; discardedPai.isRiichiDeclare = true; updateScoresUI(); } p.river.push(discardedPai); if (isTsumo) p.tsumo = null; else { p.hand = p.hand.filter(pai => pai.id !== discardedPai.id); if (p.tsumo) p.hand.push(p.tsumo); p.tsumo = null; } p.hand = sortHand(p.hand); renderAll(); if (playerIndex !== 0) { if (checkNakiAvailable(playerIndex, discardedPai)) return; } if (checkCPUActions(playerIndex, discardedPai)) return; nextTurn(); }
        function nextTurn() { if (mountain.length === 0) { executeRyukyoku(); return; } currentTurn = (currentTurn + 1) % 4; players[currentTurn].tsumo = mountain.pop(); renderAll(); if (currentTurn !== 0) setTimeout(() => { executeCPUTurn(currentTurn); }, 400); }
        function getTileValue(tile) { if (tile.suit === 'z') return 1; if (tile.num === 1 || tile.num === 9) return 2; if (tile.num === 2 || tile.num === 8) return 3; return 4; }

        function executeCPUTurn(cpuIndex) {
            let p = players[cpuIndex]; let handStr = getMajiangString(p.hand, p.tsumo, p.fulou); let shoupai = Majiang.Shoupai.fromString(handStr);
            if (Majiang.Util.xiangting(shoupai) === -1) { let param = { rule: Majiang.rule(), zhuangfeng: 0, menfeng: (cpuIndex - gameState.currentOya + 4)%4, hupai: { lizhi: p.isRiichi ? 1 : 0 }, baopai: ['m1'], fubaopai: [], jicun: { changbang: 0, lizhibang: 0 } }; let hule = Majiang.Util.hule(shoupai, null, param); if (hule) { setTimeout(() => executeAgari('tsumo', cpuIndex, hule), 400); return; } else { discardPai(cpuIndex, p.tsumo, true); return; } }
            if (p.isRiichi) { discardPai(cpuIndex, p.tsumo, true); return; }
            let allTiles = [...p.hand, p.tsumo]; let minShanten = 99; let bestTiles = []; let seen = new Set(); let simHandForTingpai = null;
            for (let tile of allTiles) { let key = tile.suit + tile.num; if (!seen.has(key)) { seen.add(key); let simHand = allTiles.filter(t => t.id !== tile.id); let s = Majiang.Util.xiangting(Majiang.Shoupai.fromString(getMajiangString(simHand, null, p.fulou))); if (s < minShanten) { minShanten = s; bestTiles = [tile]; simHandForTingpai = simHand; } else if (s === minShanten) { bestTiles.push(tile); } } }
            bestTiles.sort((a, b) => getTileValue(a) - getTileValue(b)); let lowestValue = getTileValue(bestTiles[0]); let candidates = bestTiles.filter(t => getTileValue(t) === lowestValue); let chosenPai = candidates[Math.floor(Math.random() * candidates.length)]; let isTsumo = (chosenPai.id === p.tsumo.id);
            if (minShanten === 0 && p.fulou.length === 0 && p.score >= 1000) {
                let shouldRiichi = true;
                if (p.aiType === "damaten") {
                    let tingpaiList = Majiang.Util.tingpai(Majiang.Shoupai.fromString(getMajiangString(simHandForTingpai, null, []))) || [];
                    if (tingpaiList.length > 0) {
                        let testRongpai = tingpaiList[0] + '+'; let testShoupai = Majiang.Shoupai.fromString(getMajiangString(simHandForTingpai, null, []));
                        let param = { rule: Majiang.rule(), zhuangfeng: 0, menfeng: (cpuIndex - gameState.currentOya + 4)%4, hupai: { lizhi: 0 }, baopai: ['m1'], fubaopai: [], jicun: { changbang: 0, lizhibang: 0 } };
                        if (Majiang.Util.hule(testShoupai, testRongpai, param)) shouldRiichi = false; 
                    }
                }
                if (shouldRiichi) { p.isRiichi = true; p.score -= 1000; gameState.kyotaku++; chosenPai.isRiichiDeclare = true; updateScoresUI(); }
            }
            discardPai(cpuIndex, chosenPai, isTsumo);
        }

        function renderAll() {
            document.getElementById('turnIndicator').textContent = `${players[currentTurn].name} の番`; const handArea = document.getElementById('myHandArea'); handArea.innerHTML = ''; 
            if (currentTurn === 0) handArea.classList.add('my-turn'); else handArea.classList.remove('my-turn'); let my = players[0];
            my.hand.forEach(pai => { const img = document.createElement('img'); img.src = getPaiImagePath(pai.suit, pai.num, 0); img.className = 'pai-img'; img.onclick = () => { if (currentTurn === 0 && !my.isRiichi) discardPai(0, pai, false); }; handArea.appendChild(img); });
            if (my.tsumo) { const tsumoImg = document.createElement('img'); tsumoImg.src = getPaiImagePath(my.tsumo.suit, my.tsumo.num, 0); tsumoImg.className = 'pai-img tsumo-pai'; tsumoImg.onclick = () => { if (currentTurn === 0 && !my.isRiichi) discardPai(0, my.tsumo, true); }; handArea.appendChild(tsumoImg); }
            if (my.fulou.length > 0) { const fulouGroup = document.createElement('div'); fulouGroup.className = 'fulou-group'; my.fulou.forEach(f => { f.tiles.forEach(pai => { const img = document.createElement('img'); img.src = getPaiImagePath(pai.suit, pai.num, 0); img.className = 'pai-img'; img.style.marginRight = '2px'; fulouGroup.appendChild(img); }); const space = document.createElement('div'); space.style.width = '10px'; fulouGroup.appendChild(space); }); handArea.appendChild(fulouGroup); }
            for (let i = 0; i < 4; i++) { const riverArea = document.getElementById(`river-${i}`); riverArea.innerHTML = ''; players[i].river.forEach(pai => { const img = document.createElement('img'); img.src = getPaiImagePath(pai.suit, pai.num, i); let isHorizontal = (i === 1 || i === 3); if (pai.isRiichiDeclare) isHorizontal = !isHorizontal; img.className = isHorizontal ? 'river-pai-h' : 'river-pai-v'; riverArea.appendChild(img); }); }
            for (let i = 1; i < 4; i++) { const cpuArea = document.getElementById(`cpuHand-${i}`); if (cpuArea) { cpuArea.innerHTML = ''; players[i].hand.forEach(pai => { const img = document.createElement('img'); img.src = getPaiImagePath(pai.suit, pai.num, 0); img.className = 'cpu-pai-debug'; cpuArea.appendChild(img); }); if (players[i].tsumo) { const img = document.createElement('img'); img.src = getPaiImagePath(players[i].tsumo.suit, players[i].tsumo.num, 0); img.className = 'cpu-pai-debug'; if (i === 1 || i === 3) img.style.marginTop = '6px'; else img.style.marginLeft = '6px'; cpuArea.appendChild(img); } } }
            document.getElementById('deckCount').textContent = `残り山札: ${mountain.length}枚`; if (currentTurn === 0) checkMyHand();
        }

        // ★追加：ロード時にロビー画面からの情報（localStorage）を受け取る
        window.onload = function() {
            const savedSettings = localStorage.getItem('shioyaMahjongSettings');
            if (savedSettings) {
                const settings = JSON.parse(savedSettings);
                
                // あなたの設定
                players[0].name = "あなた(" + characterMaster[settings.player].name + ")";
                document.getElementById('playerStandImage').src = characterMaster[settings.player].img;
                
                // CPU右の設定
                players[1].name = characterMaster[settings.cpuRight].name;
                players[1].aiType = characterMaster[settings.cpuRight].aiType;

                // CPU前の設定
                players[2].name = characterMaster[settings.cpuFront].name;
                players[2].aiType = characterMaster[settings.cpuFront].aiType;

                // CPU左の設定
                players[3].name = characterMaster[settings.cpuLeft].name;
                players[3].aiType = characterMaster[settings.cpuLeft].aiType;
            }
            
            gameState.currentOya = Math.floor(Math.random() * 4); gameState.startingOya = gameState.currentOya;
            gameState.kyoku = 1; gameState.honba = 0; gameState.kyotaku = 0;
            players.forEach(p => p.score = 25000);
            
            startKyoku();
        };
    </script>
