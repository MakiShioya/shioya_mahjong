<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>対局ロビー - しおや麻雀</title>
    <style>
        @font-face { font-family: 'SetoFont'; src: url('font/setofont.ttf') format('truetype'); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'SetoFont', "Hiragino Kaku Gothic ProN", sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 100vw; height: 100vh; background-color: #1e5631;
            background-image: radial-gradient(#2a7743 1px, transparent 1px); background-size: 20px 20px;
            user-select: none;
        }
        
        .lobby-title { font-size: 3rem; color: #ff9800; text-shadow: 2px 2px 0px #432517; margin-bottom: 30px; }
        .lobby-grid { display: flex; gap: 20px; margin-bottom: 40px; }
        
        .lobby-card {
            background: rgba(67, 37, 23, 0.95); border: 4px solid #ECDBBF; border-radius: 15px;
            padding: 20px; text-align: center; width: 220px; box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .lobby-card h3 { margin-bottom: 10px; font-size: 1.3rem; color: #ff9800; }
        
        .lobby-char-img {
            width: 100%; height: 200px; object-fit: cover; object-position: top;
            border-radius: 10px; margin-bottom: 15px; background-color: #ECDBBF; border: 2px solid #ECDBBF;
        }
        
        .lobby-select {
            width: 100%; padding: 10px; font-size: 1.1rem; font-family: 'SetoFont', sans-serif;
            border-radius: 5px; background: #ECDBBF; color: #432517; font-weight: bold;
            border: 2px solid #ff9800; cursor: pointer; outline: none;
        }

        .btn-start-match {
            background: linear-gradient(to bottom, #e91e63, #c2185b); color: white;
            padding: 15px 50px; font-size: 2rem; border-radius: 15px; border: 4px solid #ECDBBF;
            cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.5); font-family: 'SetoFont', sans-serif;
            transition: transform 0.1s; text-decoration: none;
        }
        .btn-start-match:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <h1 class="lobby-title">対局ロビー</h1>
    
    <div class="lobby-grid">
        <div class="lobby-card">
            <h3>あなた</h3>
            <img id="lobbyImg-0" class="lobby-char-img" src="image/character/komiya_touka.png">
            <select id="lobbySelect-0" class="lobby-select" onchange="updateLobbyImage(0)"></select>
        </div>
        <div class="lobby-card">
            <h3>CPU(右)</h3>
            <img id="lobbyImg-1" class="lobby-char-img" src="image/character/a_touka.png">
            <select id="lobbySelect-1" class="lobby-select" onchange="updateLobbyImage(1)"></select>
        </div>
        <div class="lobby-card">
            <h3>CPU(前)</h3>
            <img id="lobbyImg-2" class="lobby-char-img" src="image/character/b_touka.png">
            <select id="lobbySelect-2" class="lobby-select" onchange="updateLobbyImage(2)"></select>
        </div>
        <div class="lobby-card">
            <h3>CPU(左)</h3>
            <img id="lobbyImg-3" class="lobby-char-img" src="image/character/c_touka.png">
            <select id="lobbySelect-3" class="lobby-select" onchange="updateLobbyImage(3)"></select>
        </div>
    </div>

    <button class="btn-start-match" onclick="saveAndStart()">対局開始</button>

    <script>
        // キャラクターマスターデータ
        const characterMaster = {
            "komiya": { name: "こみや", img: "image/character/komiya_touka.png", aiType: "menzen", desc: "バランス型" },
            "char_a": { name: "キャラA", img: "image/character/a_touka.png", aiType: "menzen", desc: "門前特化型" },
            "char_b": { name: "キャラB", img: "image/character/b_touka.png", aiType: "naki_safe", desc: "役牌・タンヤオ鳴き" },
            "char_c": { name: "キャラC", img: "image/character/c_touka.png", aiType: "damaten", desc: "ヤミテン特化" },
            "char_d": { name: "キャラD", img: "image/character/d_touka.png", aiType: "menzen", desc: "トリッキー" }
        };

        function updateLobbyImage(index) {
            let selectVal = document.getElementById(`lobbySelect-${index}`).value;
            document.getElementById(`lobbyImg-${index}`).src = characterMaster[selectVal].img;
        }

        // ★選択したキャラを記憶して、game.htmlへ移動する
        function saveAndStart() {
            const settings = {
                player: document.getElementById('lobbySelect-0').value,
                cpuRight: document.getElementById('lobbySelect-1').value,
                cpuFront: document.getElementById('lobbySelect-2').value,
                cpuLeft: document.getElementById('lobbySelect-3').value
            };
            localStorage.setItem('shioyaMahjongSettings', JSON.stringify(settings));
            window.location.href = 'game.html';
        }

        window.onload = function() {
            for (let i = 0; i < 4; i++) {
                let selectElem = document.getElementById(`lobbySelect-${i}`);
                for (let key in characterMaster) {
                    let opt = document.createElement('option');
                    opt.value = key;
                    opt.text = `${characterMaster[key].name} (${characterMaster[key].desc})`;
                    selectElem.appendChild(opt);
                }
            }
            // 初期設定
            document.getElementById('lobbySelect-0').value = "komiya"; updateLobbyImage(0);
            document.getElementById('lobbySelect-1').value = "char_a"; updateLobbyImage(1);
            document.getElementById('lobbySelect-2').value = "char_b"; updateLobbyImage(2);
            document.getElementById('lobbySelect-3').value = "char_c"; updateLobbyImage(3);
        };
    </script>
</body>
</html>
